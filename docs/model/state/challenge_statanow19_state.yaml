  - "Confirmed that install and inst2 have moved to visible StataNow 19.5 branding and now recognize both installed.195 and installed.190 marker files."
  - "Confirmed that setrwxp still carries Stata 19.0.0-era naming and refers to st19 and stata19.png."
  - "Stream-listed bins.taz and confirmed the presence of stinit, libstata*.so, stata*, and xstata* entries."
  - "Did not observe st19, stata19.png, or isstata.19* in the first streamed bins.taz file-name listing."
  - "Expanded the full original media under artifacts/media and performed an isolated install into runtime/statanow19-local-b."
  - "Confirmed that the final installed tree contains installed.190, installed.195, isstata.195, and stata19.png."
  - "Confirmed that the installed StataNow19 stinit is byte-identical to the archived Stata18 stinit."
  - "Staged a local ncurses6 shim under runtime/localdeps/ncurses6 so the console runtime could be executed without system package changes."
  - "Verified that the archived Stata18 generator still writes decodable licenses for StataNow19 using the same split_prefix=4 format."
  - "Verified that empty field6 is rejected as License not applicable to StataNow, while a live field6 date starts the runtime successfully."
  - "Verified working dated examples for both BE and MP, including a 32-core MP license."
  - "Refined field6 behavior with isolated serial scans: the current host date 2026-03-26 is accepted, the prior day is expired, malformed 8-digit dates are only partially validated, and year 2050 is accepted while 2051+ is rejected as invalid."
  - "Refined field7 behavior for stata-mp: empty and nonnumeric suffixes are rejected, 0 and 1 are rejected, 2..64 are accepted, leading-zero numeric forms parse normally, and values above 64 are clamped to 64-core in the banner."
  - "Switched the normalized local launcher install at ~/.local/opt/stata-mp over to the StataNow19 runtime by repointing runtime to runtime/statanow19-local-b, adding a ncurses6 shim link, updating wrappers to dated field6 defaults, and updating the desktop icon to stata19.png."
  - "Verified that ~/.local/bin/stata-mp now starts StataNow 19.5 successfully with the default 64-core / 01012050 profile."
  - "Rebuilt ../stata18-toolkit/tools/license_lab.html so the single-file operator page now defaults to the Stata 19 MP 64-core / 01012050 profile and points Linux users at ~/.local/opt/stata-mp/runtime/stata.lic."
  - "Copied the StataNow19 runtime and ncurses6 shim into ~/.local/opt/stata-mp so the normalized local install is self-contained again and no longer depends on the challenge workspace through symlinked runtime paths."
  - "Prepared final delivery tree under delivery/ with versioned license builder, Arch packaging sources, and built package artifact."
  - "Validated the staged StataNow 19 package artifact at delivery/archpkg/statanow19-runtime/statanow19-runtime-19.5.0-1-x86_64.pkg.tar.zst."
  - "Added repository-facing GitHub Actions release workflow and Arch-container build script."
  - "Published the source-controlled delivery tree to https://github.com/Zeuyel/statanow19-toolkit on branch main."
